[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roadvision"
version = "0.1.0"
description = "Multi-task bird's-eye-view perception (depth, BEV segmentation, BEV detection) on nuScenes"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "nuscenes-devkit>=1.1.11",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.16",
    "numpy>=1.24,<2.0",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "pyquaternion>=0.9.9",
    "shapely>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/roadvision"]
